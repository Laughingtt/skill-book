            - code [ref=e5042]: "--background"
            - text: 等 token 是主题系统的核心，用 Tailwind 的
            - code [ref=e5043]: bg-primary
            - text: 而不是
            - code [ref=e5044]: bg-blue-500
        - listitem [ref=e5045]:
          - paragraph [ref=e5046]:
            - strong [ref=e5047]:
              - text: 利用
              - code [ref=e5048]: cn()
              - text: 函数合并类名
            - text: 。
            - code [ref=e5049]: cn("p-4", className)
            - text: 允许外部覆盖，
            - code [ref=e5050]: cn(className, "p-4")
            - text: 强制使用默认值
        - listitem [ref=e5051]:
          - paragraph [ref=e5052]:
            - strong [ref=e5053]:
              - text: 定期运行
              - code [ref=e5054]: shadcn diff
              - text: 检查更新
            - text: 。虽然组件代码在你项目中，但上游可能修复了 bug 或改进了无障碍支持
        - listitem [ref=e5055]:
          - paragraph [ref=e5056]:
            - strong [ref=e5057]: 在修改前备份配置文件
            - text: 。每次修改 Tailwind 配置或
            - code [ref=e5058]: globals.css
            - text: 前，先做备份
        - listitem [ref=e5059]:
