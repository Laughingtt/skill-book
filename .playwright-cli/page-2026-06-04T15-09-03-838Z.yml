      - heading "使用方法" [level=2] [ref=e1136]
      - heading "标准开发工作流" [level=3] [ref=e1137]
      - paragraph [ref=e1138]: Superpowers 的真正力量来自多个技能的组合。以下是完整的标准开发流程：
      - generic [ref=e1139]:
        - code [ref=e1140]: 1. 头脑风暴 (brainstorming) ↓ 通过问答澄清真实需求 2. 设计文档 ↓ 分段呈现设计方案，等待确认 3. 编写计划 (writing-plans) ↓ 分解为 2-5 分钟的小任务，精确到文件路径 4. Git Worktree (using-git-worktrees) ↓ 创建隔离工作空间，在新分支上开发 5. 子代理执行 (subagent-driven-development) ↓ 每个任务分派独立子代理 ↓ 两阶段审查：规格合规 + 代码质量 6. TDD (test-driven-development) ↓ 强制 RED-GREEN-REFACTOR 循环 7. 代码审查 (requesting-code-review) ↓ 质量关卡，关键问题阻断 8. 完成分支 (finishing-a-development-branch) ↓ 验证、合并/PR、清理
        - button "复制" [ref=e1141] [cursor=pointer]
      - heading "斜杠命令触发" [level=3] [ref=e1142]
      - paragraph [ref=e1143]: 技能可以通过斜杠命令手动触发：
      - generic [ref=e1144]:
        - code [ref=e1145]: "/superpowers:brainstorming # 开始头脑风暴 /superpowers:writing-plans # 编写实施计划 /superpowers:executing-plans # 执行已有计划 /superpowers:test-driven-development # 启动 TDD 流程 /superpowers:systematic-debugging # 系统化调试 /superpowers:requesting-code-review # 请求代码审查 /superpowers:verification-before-completion # 完成前验证"
        - button "复制" [ref=e1146] [cursor=pointer]
      - heading "关键词自动触发" [level=3] [ref=e1147]
      - paragraph [ref=e1148]: Superpowers 技能也通过关键词自动激活：
      - table [ref=e1149]:
        - rowgroup [ref=e1150]:
          - row "技能 触发关键词" [ref=e1151]:
            - columnheader "技能" [ref=e1152]
            - columnheader "触发关键词" [ref=e1153]
        - rowgroup [ref=e1154]:
          - row "brainstorming 需求不明确时自动触发" [ref=e1155]:
            - cell "brainstorming" [ref=e1156]
            - cell "需求不明确时自动触发" [ref=e1157]
          - row "test-driven-development “TDD”、“test-driven”、“先写测试”" [ref=e1158]:
            - cell "test-driven-development" [ref=e1159]
            - cell "“TDD”、“test-driven”、“先写测试”" [ref=e1160]
          - row "systematic-debugging “debug”、“bug”、“不工作”、“报错”" [ref=e1161]:
            - cell "systematic-debugging" [ref=e1162]
            - cell "“debug”、“bug”、“不工作”、“报错”" [ref=e1163]
          - row "writing-plans “制定计划”、“planning”" [ref=e1164]:
            - cell "writing-plans" [ref=e1165]
            - cell "“制定计划”、“planning”" [ref=e1166]
          - row "verification-before-completion 即将声称完成时自动触发" [ref=e1167]:
            - cell "verification-before-completion" [ref=e1168]
            - cell "即将声称完成时自动触发" [ref=e1169]
      - heading "实战示例：用 Superpowers 构建用户认证系统" [level=3] [ref=e1170]
      - paragraph [ref=e1171]:
        - strong [ref=e1172]: 第 1 步：头脑风暴
      - list [ref=e1173]:
        - listitem [ref=e1174]: 代理提问：需要支持哪些认证方式？是否需要 OAuth？密码策略是什么？
        - listitem [ref=e1175]: 你回答后，代理呈现设计方案
        - listitem [ref=e1176]: 你逐段确认，最终批准设计
      - paragraph [ref=e1177]:
        - strong [ref=e1178]: 第 2 步：编写计划
      - list [ref=e1179]:
        - listitem [ref=e1180]: 代理生成包含 10-15 个任务的详细计划
        - listitem [ref=e1181]: 每个任务有精确的文件路径、代码片段、验证命令
        - listitem [ref=e1182]: 你审核计划，调整后批准
      - paragraph [ref=e1183]:
        - strong [ref=e1184]: 第 3 步：子代理执行
      - list [ref=e1185]:
        - listitem [ref=e1186]: 每个任务由独立的子代理执行
        - listitem [ref=e1187]: 完成后自动审查：先检查是否与规格一致，再检查代码质量
        - listitem [ref=e1188]: 关键问题阻断，小问题记录后继续
      - paragraph [ref=e1189]:
        - strong [ref=e1190]: 第 4 步：TDD 循环
      - list [ref=e1191]:
        - listitem [ref=e1192]: 子代理先编写失败测试
        - listitem [ref=e1193]: 确认测试失败（证明测试有效）
        - listitem [ref=e1194]: 编写最小实现代码使测试通过
        - listitem [ref=e1195]: 重构清理
      - paragraph [ref=e1196]:
        - strong [ref=e1197]: 第 5 步：审查与完成
      - list [ref=e1198]:
        - listitem [ref=e1199]: 自动代码审查
        - listitem [ref=e1200]: 验证所有测试通过
        - listitem [ref=e1201]: 提交代码，提供合并选项
      - heading "技能开发指南" [level=2] [ref=e1202]
      - paragraph [ref=e1203]:
        - text: Superpowers 包含
        - code [ref=e1204]: writing-skills
        - text: 元技能，帮助你创建自定义技能。
      - heading "技能基本结构" [level=3] [ref=e1205]
      - generic [ref=e1206]:
        - code [ref=e1207]: "my-skill/ ├── SKILL.md # 技能主文件，包含指令和流程 └── resources/ # 支持文件（参考文档、模板等）"
        - button "复制" [ref=e1208] [cursor=pointer]
      - heading "SKILL.md 编写要点" [level=3] [ref=e1209]:
        - link "SKILL.md" [ref=e1210] [cursor=pointer]:
          - /url: http://SKILL.md
        - text: 编写要点
      - list [ref=e1211]:
        - listitem [ref=e1212]:
          - strong [ref=e1213]: 明确的触发条件
          - text: ：描述什么时候应该使用这个技能，代理据此决定是否自动加载
        - listitem [ref=e1214]:
          - strong [ref=e1215]: 简洁的上下文预览
          - text: ：代理在技能列表中看到的摘要，用于判断是否加载
        - listitem [ref=e1216]:
          - strong [ref=e1217]: 结构化的流程
          - text: ：按步骤描述执行过程，避免模糊指令
        - listitem [ref=e1218]:
          - strong [ref=e1219]: 具体示例
          - text: ：包含输入输出示例，帮助代理理解成功标准
        - listitem [ref=e1220]:
          - strong [ref=e1221]: 禁止事项
          - text: ：明确列出不应做的事情，比正面指令更有效
      - heading "创建步骤" [level=3] [ref=e1222]
      - list [ref=e1223]:
        - listitem [ref=e1224]:
          - text: 使用
          - code [ref=e1225]: /superpowers:writing-skills
          - text: 启动技能创建流程
        - listitem [ref=e1226]: 描述你希望技能做什么
        - listitem [ref=e1227]:
          - text: 代理会帮你生成
          - link "SKILL.md" [ref=e1228] [cursor=pointer]:
            - /url: http://SKILL.md
          - text: 和相关资源
        - listitem [ref=e1229]: 在子代理上测试技能——使用真实场景而非知识竞赛式测试
        - listitem [ref=e1230]: 迭代改进，确保技能在压力场景下依然有效
      - heading "技能组合" [level=3] [ref=e1231]
      - paragraph [ref=e1232]: 技能可以自然组合——Claude 可以同时使用多个技能。这种可组合性是框架最强大的特性之一：
      - list [ref=e1233]:
        - listitem [ref=e1234]: 头脑风暴 + 编写计划 = 从想法到可执行路线图
        - listitem [ref=e1235]: TDD + 系统化调试 = 测试驱动的故障排查
        - listitem [ref=e1236]: 子代理开发 + 代码审查 = 自动化质量保证流水线
      - heading "跨代理兼容" [level=3] [ref=e1237]
      - paragraph [ref=e1238]:
        - text: Superpowers 技能以纯 Markdown 编写，与宿主代理无关。同一套技能可在 Claude Code、Codex CLI、Cursor、Gemini CLI 等多个平台上运行。每个平台通过薄薄的清单文件（
        - code [ref=e1239]: .claude-plugin/
        - text: 、
        - code [ref=e1240]: .cursor-plugin/
        - text: 、
        - code [ref=e1241]: .codex-plugin/
        - text: 等）指向相同的 Markdown 内容。
      - heading "最佳实践" [level=2] [ref=e1242]
      - list [ref=e1243]:
        - listitem [ref=e1244]:
          - strong [ref=e1245]: 不要抗拒头脑风暴阶段
          - text: — 感觉很慢，但提问的几分钟会省下大量返工时间
        - listitem [ref=e1246]:
          - strong [ref=e1247]: 用真实任务测试，不要用"Hello World"
          - text: — Superpowers 在真实复杂度中才显现价值
        - listitem [ref=e1248]:
          - strong [ref=e1249]: 信任 TDD 流程
          - text: — 第一次看到代理先写失败测试再写最小实现时，你会感受到区别
        - listitem [ref=e1250]:
          - strong [ref=e1251]: 审核计划再执行
          - text: — 计划文档是你的恢复机制，如果会话中断，未勾选的复选框是下次会话唯一的状态日志
        - listitem [ref=e1252]:
          - strong [ref=e1253]: 让子代理自主工作
          - text: — 不要在任务间频繁检查，子代理会在真正阻塞时停下来
        - listitem [ref=e1254]:
          - strong [ref=e1255]: 优先使用子代理驱动开发
          - text: — 比内联执行（executing-plans）质量更高，尤其在大项目中
        - listitem [ref=e1256]:
          - strong [ref=e1257]:
            - text: 在
            - link "CLAUDE.md" [ref=e1258] [cursor=pointer]:
              - /url: http://CLAUDE.md
            - text: 中定制行为
          - text: — Superpowers 会优先遵循你项目中的
          - link "CLAUDE.md" [ref=e1259] [cursor=pointer]:
            - /url: http://CLAUDE.md
          - text: 或
          - link "AGENTS.md" [ref=e1260] [cursor=pointer]:
            - /url: http://AGENTS.md
          - text: 中的直接指令
        - listitem [ref=e1261]:
          - strong [ref=e1262]: 简单任务无需全流程
          - text: — 单行修改不需要完整的七阶段工作流，Superpowers 在多文件功能和完整构建中表现最佳
      - heading "常见问题" [level=2] [ref=e1263]
      - heading "Superpowers 会增加 Token 消耗吗？" [level=3] [ref=e1264]
      - paragraph [ref=e1265]: 短期来看是的，技能加载和结构化流程会增加初始 Token 用量。但长期来看，通过减少返工、避免方向性错误、降低调试成本，总 Token 消耗反而更低。Superpowers v5 已支持为机械性任务选择最经济的模型（如 Haiku），进一步控制成本。
      - heading "安装后代理没有自动触发技能怎么办？" [level=3] [ref=e1266]
      - list [ref=e1267]:
        - listitem [ref=e1268]: 确认重启了 Claude Code
        - listitem [ref=e1269]:
          - text: 检查是否看到
          - code [ref=e1270]: SessionStart:startup hook succeeded
          - text: 提示
        - listitem [ref=e1271]:
          - text: 尝试手动触发：
          - code [ref=e1272]: /superpowers:using-superpowers
        - listitem [ref=e1273]: 描述一个具体的构建任务，而非泛泛提问
      - heading "executing-plans 和 subagent-driven-development 如何选择？" [level=3] [ref=e1274]
      - list [ref=e1275]:
        - listitem [ref=e1276]:
          - strong [ref=e1277]: subagent-driven-development
          - text: （推荐）：每个任务分派独立子代理，上下文干净，适合大多数场景。需要支持子代理的平台（如 Claude Code）。
        - listitem [ref=e1278]:
          - strong [ref=e1279]: executing-plans
          - text: ：在当前会话中逐步执行，有人工检查点。适合不支持子代理的平台，或需要更紧密人工监督的场景。
      - heading "与 GSD、Spec-Kit、BMAD 等框架有何不同？" [level=3] [ref=e1280]
      - paragraph [ref=e1281]:
        - text: Superpowers 的核心差异是
        - strong [ref=e1282]: 强制 TDD
        - text: ——这是其他框架不具备的。此外，子代理驱动开发、两阶段代码审查、自动技能发现也是独特优势。GSD 侧重上下文工程和环境管理，Spec-Kit 侧重规格驱动，而 Superpowers 是完整的工程方法论。
      - heading "可以只使用部分技能吗？" [level=3] [ref=e1283]
      - paragraph [ref=e1284]:
        - text: 可以。每个技能可以独立使用，但完整工作流能发挥最大价值。你可以在
        - link "CLAUDE.md" [ref=e1285] [cursor=pointer]:
          - /url: http://CLAUDE.md
        - text: 中添加指令来定制哪些技能优先适用。Superpowers 会优先遵循你的项目指令而非内部默认行为。
      - heading "技能会自动更新吗？" [level=3] [ref=e1286]
      - paragraph [ref=e1287]:
        - text: Superpowers 更新取决于所使用的宿主平台。Claude Code 支持自动插件更新，其他平台可能需要手动更新。v5 版本已废弃旧的斜杠命令（
        - code [ref=e1288]: /brainstorm
        - text: 、
        - code [ref=e1289]: /write-plan
        - text: 、
        - code [ref=e1290]: /execute-plan
        - text: ），改为技能原生斜杠命令格式（
        - code [ref=e1291]: /superpowers:brainstorming
        - text: 等）。
      - heading "上下文窗口会成为瓶颈吗？" [level=3] [ref=e1292]
      - paragraph [ref=e1293]: 对于大型代码库，这确实是个问题。Superpowers 通过子代理架构缓解了这一压力——每个子代理从干净的上下文开始，只关注一个任务。主会话只负责协调，不承载实现细节。但在极长会话中，仍需注意上下文管理。
