      - heading "核心功能" [level=2] [ref=e901]
      - heading "1. 技能发现与自动激活（Skill Discovery）" [level=3] [ref=e902]
      - paragraph [ref=e903]:
        - text: Superpowers 技能在代理启动时自动注册。当代理开始一项任务时，会自动检查是否有适用的技能。如果有，必须使用——这不是建议，而是强制要求。
        - code [ref=e904]: using-superpowers
        - text: 技能作为框架入口，确保每个任务都不会遗漏最佳实践。
      - heading "2. 头脑风暴（Brainstorming）" [level=3] [ref=e905]
      - paragraph [ref=e906]: 通过苏格拉底式提问引导，在写任何代码之前澄清真实需求：
      - list [ref=e907]:
        - listitem [ref=e908]: 探索你可能没考虑到的替代方案
        - listitem [ref=e909]: 将设计方案分段呈现，便于消化和确认
        - listitem [ref=e910]: 保存设计文档供后续参考
      - paragraph [ref=e911]:
        - strong [ref=e912]: 触发方式
        - text: ：需求不明确时自动激活，或通过
        - code [ref=e913]: /superpowers:brainstorming
        - text: 手动触发
      - heading "3. 实施计划编写（Writing Plans）" [level=3] [ref=e914]
      - paragraph [ref=e915]: 将批准的设计分解为可执行的小任务：
      - list [ref=e916]:
        - listitem [ref=e917]: 每个步骤 2-5 分钟，精确到文件路径和代码片段
        - listitem [ref=e918]: 包含验证命令和预期结果
        - listitem [ref=e919]: 绝不允许占位符（无 TBD、TODO、“后续实现”）
        - listitem [ref=e920]: 遵循 YAGNI（你不会需要它）和 DRY 原则
        - listitem [ref=e921]: 自动自检：覆盖度扫描、占位符扫描、类型一致性检查
      - paragraph [ref=e922]:
        - strong [ref=e923]: 触发关键词
        - text: ：“制定计划”、“planning”、“make a plan”
      - heading "4. 子代理驱动开发（Subagent-Driven Development）" [level=3] [ref=e924]
      - paragraph [ref=e925]: Superpowers 最强大的模式——从"好习惯"升级为"架构创新"：
      - list [ref=e926]:
        - listitem [ref=e927]: 为主计划中的每个任务分派一个全新的子代理
        - listitem [ref=e928]: 子代理不继承会话上下文，避免累积混乱
        - listitem [ref=e929]: 两阶段审查：先检查规格合规性，再检查代码质量
        - listitem [ref=e930]: 支持选择最经济的模型处理机械性任务（如 Haiku）
        - listitem [ref=e931]: 连续执行，不在任务间暂停请示，仅在阻塞时停止
      - paragraph [ref=e932]:
        - strong [ref=e933]: 适用场景
        - text: ：有独立任务的计划执行，需要并行处理的场景
      - heading "5. 测试驱动开发（TDD）" [level=3] [ref=e934]
      - paragraph [ref=e935]:
        - text: 执行"铁律"：
        - strong [ref=e936]: 没有失败测试，就没有生产代码。
      - paragraph [ref=e937]: 严格的 RED-GREEN-REFACTOR 循环：
      - list [ref=e938]:
        - listitem [ref=e939]:
          - strong [ref=e940]: RED
          - text: — 编写描述期望行为的失败测试
        - listitem [ref=e941]:
          - strong [ref=e942]: GREEN
          - text: — 编写让测试通过的最小代码
        - listitem [ref=e943]:
          - strong [ref=e944]: REFACTOR
          - text: — 在测试通过的前提下清理、消除重复
        - listitem [ref=e945]:
          - strong [ref=e946]: COMMIT
          - text: — 绿灯时提交
      - paragraph [ref=e947]: 核心原则：如果你没有看到测试失败，你就不确定它测试的是否正确。违反规则的精神就是违反规则本身。先于测试编写的生产代码会被删除。
      - heading "6. 系统化调试（Systematic Debugging）" [level=3] [ref=e948]
      - paragraph [ref=e949]: 四阶段根本原因分析方法：
      - list [ref=e950]:
        - listitem [ref=e951]:
          - strong [ref=e952]: 根本原因调查
          - text: — 隔离问题，检查最近变更
        - listitem [ref=e953]:
          - strong [ref=e954]: 模式分析
          - text: — 识别错误模式和触发条件
        - listitem [ref=e955]:
          - strong [ref=e956]: 假设验证
          - text: — 构建可测试的假设并逐一验证
        - listitem [ref=e957]:
          - strong [ref=e958]: 实施修复
          - text: — 基于证据而非猜测修复问题
      - paragraph [ref=e959]:
        - strong [ref=e960]: 触发关键词
        - text: ：“debug”、“bug”、“不工作”、“报错”
      - heading "7. 代码审查（Code Review）" [level=3] [ref=e961]
      - paragraph [ref=e962]: 双向审查机制：
      - list [ref=e963]:
        - listitem [ref=e964]:
          - strong [ref=e965]: 请求审查
          - text: （requesting-code-review）：对照计划审查，按严重程度报告问题，关键问题阻断进度
        - listitem [ref=e966]:
          - strong [ref=e967]: 接收审查
          - text: （receiving-code-review）：技术严谨地验证反馈，不做表演性同意或盲目实施
      - heading "8. 完成前验证（Verification Before Completion）" [level=3] [ref=e968]
      - paragraph [ref=e969]: 在声称工作完成之前，必须：
      - list [ref=e970]:
        - listitem [ref=e971]: 运行验证命令并确认输出
        - listitem [ref=e972]: 证据先于断言——没有证明就不能说"完成了"
        - listitem [ref=e973]: 检查所有测试是否通过
        - listitem [ref=e974]: 确认与计划规格一致
      - heading "9. Git Worktree 隔离（Using Git Worktrees）" [level=3] [ref=e975]
      - paragraph [ref=e976]: 在设计批准后自动创建隔离工作空间：
      - list [ref=e977]:
        - listitem [ref=e978]: 在新分支上工作，保持主分支稳定
        - listitem [ref=e979]: 实验失败时轻松清理
        - listitem [ref=e980]: 支持并行开发多个功能
      - heading "10. 开发分支完成（Finishing a Development Branch）" [level=3] [ref=e981]
      - paragraph [ref=e982]: 任务完成时自动激活：
      - list [ref=e983]:
        - listitem [ref=e984]: 验证所有测试通过
        - listitem [ref=e985]: 提供选项：合并 / 创建 PR / 保留分支 / 放弃
        - listitem [ref=e986]: 清理 Worktree
      - heading "安装与配置" [level=2] [ref=e987]
      - heading "Claude Code" [level=3] [ref=e988]
      - paragraph [ref=e989]:
        - strong [ref=e990]: 方式一：官方插件市场（推荐）
