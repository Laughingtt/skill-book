    - generic [ref=e859]:
      - heading "Superpowers — AI 编程代理的结构化开发方法论" [level=1] [ref=e860]
      - heading "简介" [level=2] [ref=e861]
      - paragraph [ref=e862]: Superpowers 是由 Jesse Vincent 创建的一套完整的 AI 编程代理技能框架与软件开发方法论。它不是单一的提示词模板，而是一组可组合的技能（Skills），通过结构化引导强制 AI 代理遵循严格的工程流程，从而将"氛围编程"（Vibe Coding）转变为可预测、可验证、可审查的专业级开发实践。
      - paragraph [ref=e863]:
        - text: 核心理念：
        - strong [ref=e864]: AI 代理缺少的不是能力，而是纪律。
        - text: Superpowers 通过将工程最佳实践编码为自动触发的技能，让 Claude Code、Codex CLI、Cursor、Gemini CLI 等代理从"快速代码生成器"转变为"有条理的开发伙伴"。
      - heading "与标准 AI 编程的对比" [level=3] [ref=e865]
      - table [ref=e866]:
        - rowgroup [ref=e867]:
          - row "维度 标准 AI 编程 Superpowers 工作流" [ref=e868]:
            - columnheader "维度" [ref=e869]
