      - heading "简介" [level=2] [ref=e2982]
      - paragraph [ref=e2983]:
        - text: shadcn/ui 不是一个传统的组件库——它是构建你自己的组件库的方法。与传统组件库（如 MUI、Ant Design）不同，shadcn/ui 不会作为 NPM 包安装到
        - code [ref=e2984]: node_modules
        - text: 中，而是通过 CLI 将组件源码直接复制到你的项目中。你对代码拥有完全的控制权，可以自由修改、扩展和重构，无需担心破坏上游依赖。
      - paragraph [ref=e2985]:
        - strong [ref=e2986]: 传统组件库的痛点：
      - list [ref=e2987]:
        - listitem [ref=e2988]: 安装一个 NPM 包，导入组件，样式覆盖困难
        - listitem [ref=e2989]: 需要自定义时，不得不写 wrapper 或 hack 样式
        - listitem [ref=e2990]: 不同组件库的 API 风格不统一
        - listitem [ref=e2991]: 升级时可能破坏你的自定义代码
      - paragraph [ref=e2992]:
        - strong [ref=e2993]: shadcn/ui 的解决方式：
      - list [ref=e2994]:
        - listitem [ref=e2995]: 组件源码直接复制到你的项目中，你就是代码的主人
        - listitem [ref=e2996]:
          - text: 需要修改按钮行为？直接编辑
          - code [ref=e2997]: button.tsx
        - listitem [ref=e2998]: 所有组件共享一致的、可组合的接口
        - listitem [ref=e2999]: 基于 Radix UI / Base UI 的无头组件 + Tailwind CSS 样式
      - heading "核心特性" [level=2] [ref=e3000]
      - list [ref=e3001]:
        - listitem [ref=e3002]:
          - strong [ref=e3003]: 开放代码（Open Code）
          - text: ：组件源码直接存在于你的项目中，不是黑盒依赖。你可以自由阅读、修改和扩展每一行代码
        - listitem [ref=e3004]:
          - strong [ref=e3005]: 可组合性（Composition）
          - text: ：所有组件共享一致的 API 接口。
          - code [ref=e3006]: <Dialog>
          - text: 里有
          - code [ref=e3007]: <DialogContent>
          - text: ，
          - code [ref=e3008]: <DropdownMenu>
          - text: 里有
          - code [ref=e3009]: <DropdownMenuItem>
          - text: ，模式统一可预测
        - listitem [ref=e3010]:
          - strong [ref=e3011]: CSS 变量主题系统
          - text: ：通过
          - code [ref=e3012]: "--primary"
          - text: 、
          - code [ref=e3013]: "--background"
          - text: 、
          - code [ref=e3014]: "--radius"
          - text: 等语义化 token 管理主题，修改一处即可全局生效
        - listitem [ref=e3015]:
          - strong [ref=e3016]: 代码分发平台
          - text: ：shadcn/ui 不仅是组件集合，还定义了组件的 schema 和 CLI 分发机制，支持第三方 registry
        - listitem [ref=e3017]:
          - strong [ref=e3018]: AI 友好
          - text: ：开放的代码和一致的 API 使得 AI 工具能够理解、生成和修改组件
        - listitem [ref=e3019]:
          - strong [ref=e3020]: 美观的默认样式
          - text: ：精心设计的默认风格，包含多种视觉预设（Vega、Nova、Maia、Lyra、Mira 等）
        - listitem [ref=e3021]:
          - strong [ref=e3022]: 无障碍访问（Accessibility）
          - text: ：底层基于 Radix UI / Base UI 的无头组件，内置键盘导航、焦点管理和 ARIA 属性
