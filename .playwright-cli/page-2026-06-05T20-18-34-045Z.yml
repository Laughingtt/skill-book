          - text: 查看详细变更内容
        - listitem [ref=e489]: 按文件路径和变更语义分类（新文件 -> feat，修改文件 -> fix/refactor/feat，删除文件 -> chore/refactor，测试文件 -> test，文档 -> docs）
        - listitem [ref=e490]: 分析变更内容：改了什么、为什么改、影响范围、是否有破坏性变更
