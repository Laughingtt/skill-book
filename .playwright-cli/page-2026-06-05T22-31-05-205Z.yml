          - text: 查看详细变更内容
        - listitem [ref=e1302]: 按文件路径和变更语义分类（新文件 -> feat，修改文件 -> fix/refactor/feat，删除文件 -> chore/refactor，测试文件 -> test，文档 -> docs）
