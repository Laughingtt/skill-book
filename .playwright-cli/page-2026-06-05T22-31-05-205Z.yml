      - heading "Git Smart Commit – 规范化智能提交技能" [level=1] [ref=e865]
      - heading "简介" [level=2] [ref=e866]
      - paragraph [ref=e867]:
        - text: Git Smart Commit 是一款面向 Claude Code 的 AI 辅助提交技能，源自
        - link "claude-code-tresor" [ref=e868] [cursor=pointer]:
          - /url: https://github.com/alirezarezvani/claude-code-tresor
        - text: 项目的
        - code [ref=e869]: git-commit-helper
        - text: 技能。它能够自动分析你的
        - code [ref=e870]: git diff
        - text: ，按照架构分层将多文件修改拆分为多个符合 Conventional Commits 规范的原子提交，让提交历史清晰、语义化、机器可读。
      - paragraph [ref=e871]: 传统手动提交常常面临以下问题：
      - list [ref=e872]:
        - listitem [ref=e873]:
          - text: 提交信息模糊（如
          - code [ref=e874]: fix stuff
          - text: 、
          - code [ref=e875]: update
          - text: ）
        - listitem [ref=e876]: 多个不相关改动混合在一次提交中
        - listitem [ref=e877]: 缺乏统一格式，难以自动生成 Changelog
        - listitem [ref=e878]: 无法与语义化版本（SemVer）自动关联
      - paragraph [ref=e879]: Git Smart Commit 通过 AI 分析代码变更的语义，自动生成结构化提交消息，并按架构层（Config、API、UI、Database 等）将变更拆分为独立原子提交，彻底解决上述痛点。
      - heading "核心功能" [level=2] [ref=e880]
      - heading "1. 语义化提交消息生成" [level=3] [ref=e881]
      - paragraph [ref=e882]:
        - text: 自动分析
        - code [ref=e883]: git diff --staged
        - text: 的内容，识别变更类型并生成符合 Conventional Commits 规范的提交消息：
      - list [ref=e884]:
        - listitem [ref=e885]:
          - strong [ref=e886]: 类型自动识别
          - text: ：根据文件变更内容判断是
          - code [ref=e887]: feat
          - text: 、
          - code [ref=e888]: fix
          - text: 、
          - code [ref=e889]: refactor
          - text: 、
          - code [ref=e890]: docs
          - text: 等
        - listitem [ref=e891]:
          - strong [ref=e892]: Scope 自动推断
          - text: ：根据文件路径和模块归属推断 scope（如
          - code [ref=e893]: auth
          - text: 、
          - code [ref=e894]: api
          - text: 、
          - code [ref=e895]: ui
          - text: ）
        - listitem [ref=e896]:
          - strong [ref=e897]: 描述语义化
          - text: ：生成祈使语气的简洁描述，而非模糊的"fix bug"
      - heading "2. 按架构分层原子提交" [level=3] [ref=e898]
      - paragraph [ref=e899]: 当多个文件同时修改时，自动按架构层拆分为多个独立提交：
      - generic [ref=e900]:
        - code [ref=e901]: "同时修改了配置、数据库和前端代码 → /smart-commit commit 1: feat(config): add database connection pool settings commit 2: feat(api): add user authentication endpoints commit 3: feat(ui): add login form component"
        - button "复制" [ref=e902] [cursor=pointer]
      - paragraph [ref=e903]: 每个提交只包含同一架构层的变更，确保提交历史的原子性和可追溯性。
      - heading "3. 自动暂存（Auto-Staging）" [level=3] [ref=e904]
      - paragraph [ref=e905]:
        - text: 技能会自动执行
        - code [ref=e906]: git add
        - text: 将对应文件暂存到正确的提交中，无需手动
        - code [ref=e907]: git add
        - text: 每个文件。
