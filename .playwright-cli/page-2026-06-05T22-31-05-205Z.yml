        - button "复制" [ref=e964] [cursor=pointer]
      - paragraph [ref=e965]:
        - strong [ref=e966]: 方式三：通过 zsh 函数（HelgeSverre 方案）
      - paragraph [ref=e967]:
        - text: 将以下函数添加到
        - code [ref=e968]: ~/.zshrc
        - text: ：
      - generic [ref=e969]:
        - code [ref=e970]: "smart-commit() { local context=\"${1:-}\" local prompt=\"Analyze git changes and create logical, atomic commits using conventional commits format.\" if [ -n \"$context\" ]; then prompt=\"$prompt Context: $context\" fi claude \"$prompt\" \\ --allowedTools \"Bash(git status)\" \\ \"Bash(git diff:)\" \"Bash(git add:)\" \\ \"Bash(git commit:)\" \"Read\" \\ --disallowedTools \"Bash(git push:)\" \\ \"Bash(git reset:)\" \"Bash(git revert:)\" \\ \"Bash(git clean:)\" \"Bash(git rebase:)\" \\ \"Bash(git merge:)\" \"Bash(git checkout:)\" }"
        - button "复制" [ref=e971] [cursor=pointer]
      - paragraph [ref=e972]:
