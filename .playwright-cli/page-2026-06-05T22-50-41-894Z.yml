    - generic [ref=e1450]:
      - heading "Git Smart Commit – 规范化智能提交技能" [level=1] [ref=e1451]
      - heading "简介" [level=2] [ref=e1452]
      - paragraph [ref=e1453]:
        - text: Git Smart Commit 是一款面向 Claude Code 的 AI 辅助提交技能，源自
        - link "claude-code-tresor" [ref=e1454] [cursor=pointer]:
          - /url: https://github.com/alirezarezvani/claude-code-tresor
        - text: 项目的
        - code [ref=e1455]: git-commit-helper
        - text: 技能。它能够自动分析你的
        - code [ref=e1456]: git diff
        - text: ，按照架构分层将多文件修改拆分为多个符合 Conventional Commits 规范的原子提交，让提交历史清晰、语义化、机器可读。
      - paragraph [ref=e1457]: 传统手动提交常常面临以下问题：
      - list [ref=e1458]:
        - listitem [ref=e1459]:
          - text: 提交信息模糊（如
          - code [ref=e1460]: fix stuff
          - text: 、
          - code [ref=e1461]: update
          - text: ）
        - listitem [ref=e1462]: 多个不相关改动混合在一次提交中
        - listitem [ref=e1463]: 缺乏统一格式，难以自动生成 Changelog
        - listitem [ref=e1464]: 无法与语义化版本（SemVer）自动关联
      - paragraph [ref=e1465]: Git Smart Commit 通过 AI 分析代码变更的语义，自动生成结构化提交消息，并按架构层（Config、API、UI、Database 等）将变更拆分为独立原子提交，彻底解决上述痛点。
      - heading "核心功能" [level=2] [ref=e1466]
      - heading "1. 语义化提交消息生成" [level=3] [ref=e1467]
      - paragraph [ref=e1468]:
        - text: 自动分析
        - code [ref=e1469]: git diff --staged
        - text: 的内容，识别变更类型并生成符合 Conventional Commits 规范的提交消息：
      - list [ref=e1470]:
        - listitem [ref=e1471]:
          - strong [ref=e1472]: 类型自动识别
          - text: ：根据文件变更内容判断是
          - code [ref=e1473]: feat
          - text: 、
          - code [ref=e1474]: fix
          - text: 、
          - code [ref=e1475]: refactor
          - text: 、
          - code [ref=e1476]: docs
          - text: 等
        - listitem [ref=e1477]:
          - strong [ref=e1478]: Scope 自动推断
          - text: ：根据文件路径和模块归属推断 scope（如
          - code [ref=e1479]: auth
          - text: 、
          - code [ref=e1480]: api
          - text: 、
          - code [ref=e1481]: ui
          - text: ）
        - listitem [ref=e1482]:
          - strong [ref=e1483]: 描述语义化
          - text: ：生成祈使语气的简洁描述，而非模糊的"fix bug"
      - heading "2. 按架构分层原子提交" [level=3] [ref=e1484]
      - paragraph [ref=e1485]: 当多个文件同时修改时，自动按架构层拆分为多个独立提交：
      - generic [ref=e1486]:
        - code [ref=e1487]: "同时修改了配置、数据库和前端代码 → /smart-commit commit 1: feat(config): add database connection pool settings commit 2: feat(api): add user authentication endpoints commit 3: feat(ui): add login form component"
        - button "复制" [ref=e1488] [cursor=pointer]
      - paragraph [ref=e1489]: 每个提交只包含同一架构层的变更，确保提交历史的原子性和可追溯性。
      - heading "3. 自动暂存（Auto-Staging）" [level=3] [ref=e1490]
      - paragraph [ref=e1491]:
        - text: 技能会自动执行
        - code [ref=e1492]: git add
        - text: 将对应文件暂存到正确的提交中，无需手动
        - code [ref=e1493]: git add
        - text: 每个文件。
