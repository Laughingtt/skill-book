        - button "复制" [ref=e1550] [cursor=pointer]
      - paragraph [ref=e1551]:
        - strong [ref=e1552]: 方式三：通过 zsh 函数（HelgeSverre 方案）
      - paragraph [ref=e1553]:
        - text: 将以下函数添加到
        - code [ref=e1554]: ~/.zshrc
        - text: ：
      - generic [ref=e1555]:
        - code [ref=e1556]: "smart-commit() { local context=\"${1:-}\" local prompt=\"Analyze git changes and create logical, atomic commits using conventional commits format.\" if [ -n \"$context\" ]; then prompt=\"$prompt Context: $context\" fi claude \"$prompt\" \\ --allowedTools \"Bash(git status)\" \\ \"Bash(git diff:)\" \"Bash(git add:)\" \\ \"Bash(git commit:)\" \"Read\" \\ --disallowedTools \"Bash(git push:)\" \\ \"Bash(git reset:)\" \"Bash(git revert:)\" \\ \"Bash(git clean:)\" \"Bash(git rebase:)\" \\ \"Bash(git merge:)\" \"Bash(git checkout:)\" }"
        - button "复制" [ref=e1557] [cursor=pointer]
      - paragraph [ref=e1558]:
        - text: 然后在终端执行
        - code [ref=e1559]: source ~/.zshrc
        - text: 使其生效。
